<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Groningen - Live</title>
    <!-- Tailwind CSS voor opmaak -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="bg-red-600 text-white p-2.5 rounded-xl">
                <i class="fa-solid fa-triangle-exclamation text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white flex items-center gap-2">
                    P2000 Groningen Live
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                </h1>
                <p class="text-xs text-slate-400">Regio Groningen live monitor</p>
            </div>
        </div>
        <button onclick="laadLiveData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-medium border border-slate-700 transition flex items-center gap-2">
            <i class="fa-solid fa-rotate" id="refresh-icon"></i> Vernieuwen
        </button>
    </header>

    <!-- Meldingen Lijst -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow">
        <div id="meldingen" class="space-y-3">
            <div class="text-center py-20 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-red-500"></i>
                <p class="text-sm">Live meldingen ophalen...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-3 text-center text-xs text-slate-500">
        Vernieuwt automatisch elke 20 seconden
    </footer>

    <!-- Simpele JavaScript voor Live Data -->
    <script>
        async function laadLiveData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('fa-spin');

            try {
                // We halen de officiële openbare P2000 Groningen feed op via een snelle, betrouwbare converter
                const url = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('http://feeds.feedburner.com/p2000-regio-groningen');
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    const container = document.getElementById('meldingen');
                    container.innerHTML = '';

                    data.items.forEach(item => {
                        // Tijd netjes formatteren
                        let tijd = 'Zojuist';
                        try {
                            const d = new Date(item.pubDate);
                            tijd = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        } catch(e){}

                        let tekst = item.title + ' ' + (item.description || '');
                        tekst = tekst.replace(/<[^>]*>?/gm, ''); // HTML tags opschonen

                        // Bepaal kleur op basis van dienst
                        let badge = '<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[11px] font-bold px-2 py-0.5 rounded">P2000</span>';
                        let icoon = 'fa-truck-medical text-amber-400';
                        
                        const l = tekst.toLowerCase();
                        if (l.includes('brandweer') || l.includes('prio 1') || l.includes('brand')) {
                            badge = '<span class="bg-red-500/10 text-red-400 border border-red-500/20 text-[11px] font-bold px-2 py-0.5 rounded">Brandweer</span>';
                            icoon = 'fa-fire-flame-curved text-red-500';
                        } else if (l.includes('ambulance') || l.includes('a1') || l.includes('a2')) {
                            badge = '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[11px] font-bold px-2 py-0.5 rounded">Ambulance</span>';
                            icoon = 'fa-truck-medical text-emerald-400';
                        } else if (l.includes('politie')) {
                            badge = '<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[11px] font-bold px-2 py-0.5 rounded">Politie</span>';
                            icoon = 'fa-shield-halved text-blue-400';
                        }

                        // HTML kaartje per melding
                        container.innerHTML += `
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-start gap-3.5 shadow-sm">
                                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 shrink-0">
                                    <i class="fa-solid ${icoon} text-base"></i>
                                </div>
                                <div class="flex-grow">
                                    <div class="flex items-center justify-between mb-1">
                                        ${badge}
                                        <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${tijd}</span>
                                    </div>
                                    <p class="text-sm text-slate-200 font-mono">${tekst}</p>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error('Fout bij laden:', error);
            } finally {
                icon.classList.remove('fa-spin');
            }
        }

        // Direct laden bij openen
        laadLiveData();

        // Elke 20 seconden automatisch verversen
        setInterval(laadLiveData, 20000);
    </script>
</body>
</html>
