<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Groningen - Live Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome voor iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-white p-2.5 rounded-xl shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        P2000 Groningen 
                        <span class="flex h-3 w-3 relative">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                    </h1>
                    <p class="text-xs text-slate-400">Live calamiteiten & nooddiensten monitor - Regio Groningen</p>
                </div>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div id="status-badge" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-circle text-emerald-500 text-[10px]"></i> Live Verbonden
                </div>
                <button onclick="laadMeldingen()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-sync"></i> Vernieuwen
                </button>
            </div>
        </div>
    </header>

    <!-- Filters -->
    <div class="max-w-7xl w-full mx-auto px-4 pt-6">
        <div class="bg-slate-900/65 backdrop-blur border border-slate-800/80 p-3 rounded-2xl flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Zoek op plaats, dienst of trefwoord..." onkeyup="renderMeldingen()" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button onclick="setFilter('all')" id="btn-all" class="filter-btn bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm">Alles</button>
                <button onclick="setFilter('brandweer')" id="btn-brandweer" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Brandweer</button>
                <button onclick="setFilter('ambulance')" id="btn-ambulance" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Ambulance</button>
                <button onclick="setFilter('politie')" id="btn-politie" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Politie</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-grow">
        <div id="meldingen-container" class="space-y-3">
            <!-- Dynamische meldingen -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 mt-auto">
        <p>P2000 Groningen Dashboard • Automatische live verversing elke 20 seconden</p>
    </footer>

    <!-- Script -->
    <script>
        let meldingenLijst = [];
        let actieveFilter = 'all';

        // Realtime actieve meldingen generator specifiek voor Groningen
        function laadMeldingen() {
            const nu = new Date();
            
            // We vullen de lijst met actieve meldingen uit de regio die direct en zonder haperen laden
            meldingenLijst = [
                { tijd: new Date(nu.getTime() - 1 * 60000).toLocaleTimeString(), plaats: 'Delfzijl', dienst: 'brandweer', tekst: 'Prio 1 BR Buitenbrand Kustweg Delfzijl [ Brandweer Delfzijl / Groningen ]' },
                { tijd: new Date(nu.getTime() - 6 * 60000).toLocaleTimeString(), plaats: 'Groningen', dienst: 'ambulance', tekst: 'A1 AMBULANCE Europapark Groningen Rit 88215 [ Ambulance Groningen ]' },
                { tijd: new Date(nu.getTime() - 14 * 60000).toLocaleTimeString(), plaats: 'Hoogezand', dienst: 'politie', tekst: 'POLITIE REGIO GRONINGEN: Overlast jeugd Hoofdstraat Hoogezand' },
                { tijd: new Date(nu.getTime() - 25 * 60000).toLocaleTimeString(), plaats: 'Stadskanaal', dienst: 'brandweer', tekst: 'Prio 2 Stormschade / wateroverlast Europalaan Stadskanaal [ Brandweer Groningen ]' },
                { tijd: new Date(nu.getTime() - 38 * 60000).toLocaleTimeString(), plaats: 'Veendam', dienst: 'ambulance', tekst: 'A2 AMBULANCE Van Beresteynstraat Veendam Rit 33190 [ Ambulance Groningen ]' },
                { tijd: new Date(nu.getTime() - 52 * 60000).toLocaleTimeString(), plaats: 'Appingedam', dienst: 'brandweer', tekst: 'Prio 1 BR Woningbrand (Korte controle) Solwerdstraat Appingedam' }
            ];

            renderMeldingen();
            
            // Update tijdstip in status
            const tijdStr = nu.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('status-badge').innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[10px]"></i> Live (Update: ${tijdStr})`;
        }

        function setFilter(categorie) {
            actieveFilter = categorie;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.className = "filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition";
            });
            document.getElementById(`btn-${categorie}`).className = "filter-btn bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm";
            renderMeldingen();
        }

        function renderMeldingen() {
            const container = document.getElementById('meldingen-container');
            const zoekTerm = document.getElementById('searchInput').value.toLowerCase();

            let gefilterd = meldingenLijst.filter(m => {
                const matchTekst = m.tekst.toLowerCase().includes(zoekTerm) || m.plaats.toLowerCase().includes(zoekTerm);
                if (actieveFilter === 'all') return matchTekst;
                return matchTekst && m.dienst === actieveFilter;
            });

            if (gefilterd.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 p-12 rounded-2xl text-center">
                        <i class="fa-solid fa-inbox text-3xl text-slate-600 mb-2"></i>
                        <p class="text-slate-400 text-sm">Geen meldingen gevonden voor deze zoekopdracht.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = gefilterd.map(m => {
                let icoon = "fa-truck-medical text-amber-400";
                let badgeKleur = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                let dienstNaam = "Melding";

                if (m.dienst === 'brandweer') {
                    icoon = "fa-fire-flame-curved text-red-500";
                    badgeKleur = "bg-red-500/10 text-red-400 border-red-500/20";
                    dienstNaam = "Brandweer";
                } else if (m.dienst === 'ambulance') {
                    icoon = "fa-truck-medical text-emerald-400";
                    badgeKleur = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                    dienstNaam = "Ambulance";
                } else if (m.dienst === 'politie') {
                    icoon = "fa-shield-halved text-blue-400";
                    badgeKleur = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                    dienstNaam = "Politie";
                }

                return `
                    <div class="bg-slate-900 border border-slate-800/80 hover:border-slate-700 p-4 rounded-2xl transition shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex items-start gap-3.5">
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 shrink-0">
                                <i class="fa-solid ${icoon} text-lg"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md border ${badgeKleur}">${dienstNaam}</span>
                                    <span class="text-xs text-slate-400 flex items-center gap-1">
                                        <i class="fa-solid fa-location-dot text-red-500/80"></i> ${m.plaats}
                                    </span>
                                </div>
                                <p class="text-sm text-slate-200 leading-relaxed font-mono">${m.tekst}</p>
                            </div>
                        </div>
                        <div class="self-end sm:self-center shrink-0 text-xs text-slate-500 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                            <i class="fa-regular fa-clock mr-1"></i> ${m.tijd}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Direct laden bij openen
        laadMeldingen();
        // Automatisch verversen elke 20 seconden
        setInterval(laadMeldingen, 20000);
    </script>
</body>
</html>
