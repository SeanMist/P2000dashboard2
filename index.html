<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Meldingen - Groningen</title>
    <!-- Tailwind CSS voor een moderne, strakke vormgeving -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome voor iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .live-dot { animation: pulse-slow 2s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-white p-2.5 rounded-xl shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        P2000 Groningen 
                        <span class="flex h-3 w-3 relative">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                    </h1>
                    <p class="text-xs text-slate-400">Live calamiteiten & nood- en hulpdiensten monitor</p>
                </div>
            </div>

            <!-- Besturing / Status -->
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div id="status-badge" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-rotate fa-spin text-emerald-400"></i> Bezig met laden...
                </div>
                <button onclick="fetchP2000Data()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-sync"></i> Vernieuwen
                </button>
            </div>
        </div>
    </header>

    <!-- Filters -->
    <div class="max-w-7xl w-full mx-auto px-4 pt-6">
        <div class="bg-slate-900/65 backdrop-blur border border-slate-800/80 p-3 rounded-2xl flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Zoek op plaats, dienst of tekst..." onkeyup="filterMeldingen()" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button onclick="setFilter('all')" id="btn-all" class="filter-btn bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm">Alles</button>
                <button onclick="setFilter('Brandweer')" id="btn-Brandweer" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Brandweer</button>
                <button onclick="setFilter('Ambulance')" id="btn-Ambulance" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Ambulance</button>
                <button onclick="setFilter('Politie')" id="btn-Politie" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Politie</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-grow">
        <div id="meldingen-container" class="space-y-3">
            <div class="text-center py-16 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-red-500"></i>
                <p>P2000 meldingen worden opgehaald uit de regio Groningen...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 mt-auto">
        <p>Data bron: Openbare P2000 API • Automatische verversing elke 30 seconden</p>
    </footer>

    <!-- JavaScript Logica -->
    <script>
        let allMeldingen = [];
        let activeFilter = 'all';

        async function fetchP2000Data() {
            const statusBadge = document.getElementById('status-badge');
            statusBadge.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-emerald-400"></i> Bezig met laden...`;
            
            try {
                const response = await fetch('https://api.p2000.nl/api/v1/messages?province=Groningen&limit=50');
                if (!response.ok) throw new Error('Netwerkfout');
                
                const data = await response.json();
                allMeldingen = data.data || data || [];
                
                renderMeldingen();
                
                const now = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                statusBadge.innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[10px]"></i> Laatste update: ${now}`;
            } catch (error) {
                console.error('Fout:', error);
                statusBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Verbindingsfout (Herpoging volgt)`;
                
                if(allMeldingen.length === 0) {
                    document.getElementById('meldingen-container').innerHTML = `
                        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center">
                            <i class="fa-solid fa-wifi text-4xl text-amber-500 mb-3"></i>
                            <h3 class="text-base font-semibold text-slate-200">Kan geen live verbinding maken</h3>
                            <button onclick="fetchP2000Data()" class="mt-4 bg-red-600 hover:bg-red-500 text-white text-xs font-medium px-4 py-2 rounded-xl transition">Opnieuw proberen</button>
                        </div>
                    `;
                }
            }
        }

        function setFilter(category) {
            activeFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition";
            });
            const activeBtn = document.getElementById(`btn-${category}`);
            if(activeBtn) {
                activeBtn.className = "filter-btn bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm";
            }
            renderMeldingen();
        }

        function filterMeldingen() {
            renderMeldingen();
        }

        function renderMeldingen() {
            const container = document.getElementById('meldingen-container');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allMeldingen.filter(m => {
                const text = (m.text || m.message || m.summary || '').toLowerCase();
                const cap1 = (m.capcodes || m.services || []).join(' ').toLowerCase();
                const city = (m.city || m.location || '').toLowerCase();
                
                const matchesSearch = text.includes(searchText) || cap1.includes(searchText) || city.includes(searchText);
                
                if (activeFilter === 'all') return matchesSearch;
                return matchesSearch && text.includes(activeFilter.toLowerCase());
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 p-12 rounded-2xl text-center">
                        <i class="fa-solid fa-inbox text-3xl text-slate-600 mb-2"></i>
                        <p class="text-slate-400 text-sm">Geen meldingen gevonden die aan je filters voldoen.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(m => {
                const timeStr = m.timestamp || m.time || m.date || new Date().toISOString();
                let formattedTime = timeStr;
                try {
                    const d = new Date(timeStr);
                    if(!isNaN(d)) {
                        formattedTime = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }
                } catch(e){}

                const text = m.text || m.message || m.summary || 'Geen details beschikbaar';
                const city = m.city || m.location || 'Groningen';
                
                let icon = "fa-truck-medical text-amber-400";
                let badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                let serviceType = "P2000 Melding";
                
                const lowerText = text.toLowerCase();
                if(lowerText.includes('brandweer') || lowerText.includes('prio 1') || lowerText.includes('buitenbrand') || lowerText.includes('gerucht') || lowerText.includes('hulpverlening')) {
                    icon = "fa-fire-flame-curved text-red-500";
                    badgeColor = "bg-red-500/10 text-red-400 border-red-500/20";
                    serviceType = "Brandweer";
                } else if(lowerText.includes('ambulance') || lowerText.includes('a1') || lowerText.includes('a2')) {
                    icon = "fa-truck-medical text-emerald-400";
                    badgeColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                    serviceType = "Ambulance";
                } else if(lowerText.includes('politie')) {
                    icon = "fa-shield-halved text-blue-400";
                    badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                    serviceType = "Politie";
                }

                return `
                    <div class="bg-slate-900 border border-slate-800/80 hover:border-slate-700 p-4 rounded-2xl transition shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex items-start gap-3.5">
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 shrink-0">
                                <i class="fa-solid ${icon} text-lg"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md border ${badgeColor}">${serviceType}</span>
                                    <span class="text-xs text-slate-400 flex items-center gap-1">
                                        <i class="fa-solid fa-location-dot text-red-500/80"></i> ${city}
                                    </span>
                                </div>
                                <p class="text-sm text-slate-200 leading-relaxed font-mono">${text}</p>
                            </div>
                        </div>
                        <div class="self-end sm:self-center shrink-0 text-xs text-slate-500 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                            <i class="fa-regular fa-clock mr-1"></i> ${formattedTime}
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchP2000Data();
        setInterval(fetchP2000Data, 30000);
    </script>
</body>
</html>
