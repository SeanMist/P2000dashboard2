<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Groningen - Live Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome voor iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-white p-2.5 rounded-xl shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        P2000 Groningen 
                        <span class="flex h-3 w-3 relative">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                    </h1>
                    <p class="text-xs text-slate-400">Echt live P2000 calamiteiten monitor - Regio Groningen</p>
                </div>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div id="status-badge" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-rotate fa-spin text-emerald-400"></i> Live data ophalen...
                </div>
                <button onclick="haalLiveMeldingen()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-sync"></i> Vernieuwen
                </button>
            </div>
        </div>
    </header>

    <!-- Filters -->
    <div class="max-w-7xl w-full mx-auto px-4 pt-6">
        <div class="bg-slate-900/65 backdrop-blur border border-slate-800/80 p-3 rounded-2xl flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Zoek op plaats, dienst of tekst..." onkeyup="renderMeldingen()" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button onclick="setFilter('all')" id="btn-all" class="filter-btn bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm">Alles</button>
                <button onclick="setFilter('brandweer')" id="btn-brandweer" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Brandweer</button>
                <button onclick="setFilter('ambulance')" id="btn-ambulance" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Ambulance</button>
                <button onclick="setFilter('politie')" id="btn-politie" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Politie</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-grow">
        <div id="meldingen-container" class="space-y-3">
            <div class="text-center py-16 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-red-500"></i>
                <p>Verbinding maken met live P2000 Groningen server...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 mt-auto">
        <p>Live P2000 Database • Automatische verversing elke 15 seconden</p>
    </footer>

    <!-- Script voor echte live data -->
    <script>
        let alleMeldingen = [];
        let actieveFilter = 'all';

        async function haalLiveMeldingen() {
            const statusBadge = document.getElementById('status-badge');
            statusBadge.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-emerald-400"></i> Gegevens ophalen...`;

            try {
                // We gebruiken een snelle openbare proxy die de live P2000 api raadpleegt voor Groningen
                const url = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://api.p2000.nl/api/v1/messages?province=Groningen&limit=40');
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Netwerkfout');
                
                const data = await response.json();
                const parsedData = JSON.parse(data.contents);
                
                alleMeldingen = parsedData.data || parsedData || [];

                if(alleMeldingen.length === 0) {
                    throw new Error('Geen meldingen');
                }

                renderMeldingen();
                
                const tijdNu = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                statusBadge.innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[10px]"></i> Live Verbonden (Laatste check: ${tijdNu})`;

            } catch (error) {
                console.error('Fout bij ophalen:', error);
                statusBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Live feed tijdelijk traag (Herpoging volgt)`;
                
                // Als de externe API even weigert, vallen we terug op een direct werkende alternatieve live stream via RSS
                laadAlternatieveLiveFeed();
            }
        }

        async function laadAlternatieveLiveFeed() {
            try {
                const rssUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent('http://feeds.feedburner.com/p2000-regio-groningen');
                const res = await fetch(rssUrl);
                const json = await res.json();
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(json.contents, 'text/xml');
                const items = xml.querySelectorAll('item');
                
                alleMeldingen = [];
                items.forEach(item => {
                    const title = item.querySelector('title') ? item.querySelector('title').textContent : '';
                    const desc = item.querySelector('description') ? item.querySelector('description').textContent : '';
                    const date = item.querySelector('pubDate') ? item.querySelector('pubDate').textContent : '';
                    
                    alleMeldingen.push({
                        text: title + ' ' + desc,
                        city: 'Groningen',
                        timestamp: date || new Date().toISOString()
                    });
                });

                renderMeldingen();
                document.getElementById('status-badge').innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[10px]"></i> Live RSS Verbonden`;
            } catch(e) {
                document.getElementById('meldingen-container').innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center">
                        <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500 mb-2"></i>
                        <p class="text-slate-300 text-sm">Kan geen verbinding maken met de live server. Klik op Vernieuwen.</p>
                    </div>`;
            }
        }

        function setFilter(categorie) {
            actieveFilter = categorie;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.className = "filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition";
            });
            document.getElementById(`btn-${categorie}`).className = "filter-btn bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm";
            renderMeldingen();
        }

        function renderMeldingen() {
            const container = document.getElementById('meldingen-container');
            const zoekTerm = document.getElementById('searchInput').value.toLowerCase();

            let gefilterd = alleMeldingen.filter(m => {
                const tekst = (m.text || m.message || '').toLowerCase();
                const plaats = (m.city || m.location || '').toLowerCase();
                
                const match = tekst.includes(zoekTerm) || plaats.includes(zoekTerm);
                
                if (actieveFilter === 'all') return match;
                return match && tekst.includes(actieveFilter);
            });

            if (gefilterd.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 p-12 rounded-2xl text-center">
                        <i class="fa-solid fa-inbox text-3xl text-slate-600 mb-2"></i>
                        <p class="text-slate-400 text-sm">Geen actieve meldingen gevonden.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = gefilterd.map(m => {
                const tekst = m.text || m.message || 'Geen details';
                const plaats = m.city || m.location || 'Groningen';
                
                let tijdWeergave = 'Zojuist';
                try {
                    const rawTijd = m.timestamp || m.time || m.date;
                    if(rawTijd) {
                        const d = new Date(rawTijd);
                        if(!isNaN(d)) {
                            tijdWeergave = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        }
                    }
                } catch(e){}

                let icoon = "fa-truck-medical text-amber-400";
                let badgeKleur = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                let dienstNaam = "P2000";

                const lTekst = tekst.toLowerCase();
                if (lTekst.includes('brandweer') || lTekst.includes('prio 1') || lTekst.includes('brand') || lTekst.includes('buitenbrand')) {
                    icoon = "fa-fire-flame-curved text-red-500";
                    badgeKleur = "bg-red-500/10 text-red-400 border-red-500/20";
                    dienstNaam = "Brandweer";
                } else if (lTekst.includes('ambulance') || lTekst.includes('a1') || lTekst.includes('a2')) {
                    icoon = "fa-truck-medical text-emerald-400";
                    badgeKleur = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                    dienstNaam = "Ambulance";
                } else if (lTekst.includes('politie')) {
                    icoon = "fa-shield-halved text-blue-400";
                    badgeKleur = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                    dienstNaam = "Politie";
                }

                return `
                    <div class="bg-slate-900 border border-slate-800/80 hover:border-slate-700 p-4 rounded-2xl transition shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex items-start gap-3.5">
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 shrink-0">
                                <i class="fa-solid ${icoon} text-lg"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md border ${badgeKleur}">${dienstNaam}</span>
                                    <span class="text-xs text-slate-400 flex items-center gap-1">
                                        <i class="fa-solid fa-location-dot text-red-500/80"></i> ${plaats}
                                    </span>
                                </div>
                                <p class="text-sm text-slate-200 leading-relaxed font-mono">${tekst}</p>
                            </div>
                        </div>
                        <div class="self-end sm:self-center shrink-0 text-xs text-slate-500 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                            <i class="fa-regular fa-clock mr-1"></i> ${tijdWeergave}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Direct live ophalen bij openen
        haalLiveMeldingen();
        // Elke 15 seconden automatisch vernieuwen voor echte live meldingen
        setInterval(haalLiveMeldingen, 15000);
    </script>
</body>
</html>
