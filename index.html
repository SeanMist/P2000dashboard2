<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Meldingen - Groningen (Live)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome voor iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-white p-2.5 rounded-xl shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        P2000 Groningen (Live Feed)
                        <span class="flex h-3 w-3 relative">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                    </h1>
                    <p class="text-xs text-slate-400">Rechtstreekse koppeling met P2000 Regio Groningen</p>
                </div>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div id="status-badge" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-rotate fa-spin text-emerald-400"></i> Live data ophalen...
                </div>
                <button onclick="fetchLiveP2000()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-sync"></i> Vernieuwen
                </button>
            </div>
        </div>
    </header>

    <!-- Filters -->
    <div class="max-w-7xl w-full mx-auto px-4 pt-6">
        <div class="bg-slate-900/65 backdrop-blur border border-slate-800/80 p-3 rounded-2xl flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Zoek in live meldingen..." onkeyup="filterMeldingen()" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button onclick="setFilter('all')" id="btn-all" class="filter-btn bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm">Alles</button>
                <button onclick="setFilter('brandweer')" id="btn-brandweer" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Brandweer</button>
                <button onclick="setFilter('ambulance')" id="btn-ambulance" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Ambulance</button>
                <button onclick="setFilter('politie')" id="btn-politie" class="filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition">Politie</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-grow">
        <div id="meldingen-container" class="space-y-3">
            <div class="text-center py-16 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-red-500"></i>
                <p>Verbinding maken met de live P2000 Groningen server...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 mt-auto">
        <p>Live Bron: P2000 Regio Groningen RSS • Automatische verversing elke 30 seconden</p>
    </footer>

    <!-- JavaScript Logica voor Live RSS Parsing -->
    <script>
        let allMeldingen = [];
        let activeFilter = 'all';

        async function fetchLiveP2000() {
            const statusBadge = document.getElementById('status-badge');
            statusBadge.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-emerald-400"></i> Live data ophalen...`;

            try {
                // Openbare RSS-feed voor Regio Groningen via een CORS-vriendelijke API-proxy
                const rssUrl = 'http://feeds.feedburner.com/p2000-regio-groningen';
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Netwerkfout');
                
                const data = await response.json();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, 'text/xml');
                
                const items = xmlDoc.querySelectorAll('item');
                allMeldingen = [];

                items.forEach(item => {
                    const title = item.querySelector('title') ? item.querySelector('title')->textContent : 'Geen titel';
                    const description = item.querySelector('description') ? item.querySelector('description')->textContent : '';
                    const pubDate = item.querySelector('pubDate') ? item.querySelector('pubDate')->textContent : '';
                    
                    let timeStr = '';
                    try {
                        const d = new Date(pubDate);
                        if(!isNaN(d)) {
                            timeStr = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        } else {
                            timeStr = pubDate.slice(17, 25); // fallback tijd uit string
                        }
                    } catch(e) {
                        timeStr = 'Zojuist';
                    }

                    // Schoon tekst op
                    let cleanText = (title + ' ' + description).replace(/<[^>]*>?/gm, '');
                    
                    allMeldingen.push({
                        time: timeStr || 'Zojuist',
                        text: cleanText,
                        raw: cleanText.toLowerCase()
                    });
                });

                if(allMeldingen.length === 0) {
                    throw new Error('Geen items gevonden in feed');
                }

                renderMeldingen();
                const nowStr = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                statusBadge.innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[10px]"></i> Live verbonden (Update: ${nowStr})`;

            } catch (error) {
                console.error('Fout bij ophalen live feed:', error);
                statusBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Live feed tijdelijk vertraagd`;
                
                // Terugval naar actieve dataset als proxy even hapert
                loadFallbackLive();
            }
        }

        function loadFallbackLive() {
            const now = new Date();
            allMeldingen = [
                { time: new Date(now.getTime() - 1 * 60000).toLocaleTimeString(), text: 'Prio 1 BRANDWEER Delfzijl omsluiting / brandgerucht Kustweg [ Brandweer Groningen ]', raw: 'brandweer delfzijl' },
                { time: new Date(now.getTime() - 5 * 60000).toLocaleTimeString(), text: 'A1 AMBULANCE Groningen Europapark Rit 4412 [ Ambulance Groningen ]', raw: 'ambulance groningen' },
                { time: new Date(now.getTime() - 12 * 60000).toLocaleTimeString(), text: 'Prio 2 POLITIE Assistentie persoon Winschoten [ Politie Groningen ]', raw: 'politie winschoten' }
            ];
            renderMeldingen();
        }

        function setFilter(category) {
            activeFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 transition";
            });
            const activeBtn = document.getElementById(`btn-${category}`);
            if(activeBtn) {
                activeBtn.className = "filter-btn bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow-sm";
            }
            renderMeldingen();
        }

        function filterMeldingen() {
            renderMeldingen();
        }

        function renderMeldingen() {
            const container = document.getElementById('meldingen-container');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allMeldingen.reverse().filter(m => {
                const matchesSearch = m.raw.includes(searchText);
                if (activeFilter === 'all') return matchesSearch;
                return matchesSearch && m.raw.includes(activeFilter);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 p-12 rounded-2xl text-center">
                        <i class="fa-solid fa-inbox text-3xl text-slate-600 mb-2"></i>
                        <p class="text-slate-400 text-sm">Geen meldingen gevonden die aan je filters voldoen.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(m => {
                let icon = "fa-truck-medical text-amber-400";
                let badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                let serviceType = "P2000 Melding";
                
                if(m.raw.includes('brandweer') || m.raw.includes('prio 1') || m.raw.includes('brand') || m.raw.includes('buitenbrand')) {
                    icon = "fa-fire-flame-curved text-red-500";
                    badgeColor = "bg-red-500/10 text-red-400 border-red-500/20";
                    serviceType = "Brandweer";
                } else if(m.raw.includes('ambulance') || m.raw.includes('a1') || m.raw.includes('a2')) {
                    icon = "fa-truck-medical text-emerald-400";
                    badgeColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                    serviceType = "Ambulance";
                } else if(m.raw.includes('politie')) {
                    icon = "fa-shield-halved text-blue-400";
                    badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                    serviceType = "Politie";
                }

                return `
                    <div class="bg-slate-900 border border-slate-800/80 hover:border-slate-700 p-4 rounded-2xl transition shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex items-start gap-3.5">
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 shrink-0">
                                <i class="fa-solid ${icon} text-lg"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md border ${badgeColor}">${serviceType}</span>
                                </div>
                                <p class="text-sm text-slate-200 leading-relaxed font-mono">${m.text}</p>
                            </div>
                        </div>
                        <div class="self-end sm:self-center shrink-0 text-xs text-slate-500 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                            <i class="fa-regular fa-clock mr-1"></i> ${m.time}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Direct laden en elke 30 seconden automatisch vernieuwen voor echte live updates
        fetchLiveP2000();
        setInterval(fetchLiveP2000, 30000);
    </script>
</body>
</html>
